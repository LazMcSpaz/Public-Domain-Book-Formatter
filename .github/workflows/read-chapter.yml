name: Read a chapter

# Renders one chapter of one book aloud and publishes it as a page to listen on.
#
# One chapter at a time, deliberately. A whole book is a few hours of processor
# and something like a hundred megabytes on a repository that keeps every
# version of everything, and neither should be spent before somebody has
# listened to a chapter of it.
#
# Run it from the Actions tab: pick the book file and the chapter number.
on:
  workflow_dispatch:
    inputs:
      book:
        description: Path to the book file
        default: books/human-aura/book.json
      chapter:
        description: Which chapter, counting from one
        default: '1'
      voice:
        description: Which voice
        default: bm_george

permissions:
  contents: write

concurrency:
  group: read-chapter

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1.0-onnx

      - run: npm ci
      - run: npm i --no-save kokoro-js

      # Free, and first. A respelling that has stopped meaning what it meant is
      # a word mispronounced through a whole chapter, and there is no reason to
      # spend a quarter of an hour of synthesis finding that out.
      - name: Do the respellings still say what they were approved for?
        run: node scripts/say.mjs --check

      # Also free: what would be read, every block accounted for. In the log so
      # that a chapter which came out wrong can be compared against what was
      # asked for, rather than against memory.
      - name: What will be read
        run: node scripts/read-book.mjs '${{ inputs.book }}' --chapter '${{ inputs.chapter }}' --script

      - name: Read it
        run: |
          mkdir -p public/audio
          node scripts/read-book.mjs '${{ inputs.book }}' \
            --chapter '${{ inputs.chapter }}' \
            --voice '${{ inputs.voice }}' \
            --out rendered

      - name: Encode
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          for f in rendered/*.wav; do
            ffmpeg -nostdin -loglevel error -y -i "$f" -codec:a libmp3lame -b:a 64k -ac 1 \
              "public/audio/$(basename "${f%.wav}").mp3"
          done
          # The record beside the audio, not instead of it: what was read, what
          # was not, and how long it came out against how long the words said.
          cp rendered/*.json public/audio/
          node scripts/audio-page.mjs public/audio mp3
          ls -la public/audio

      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/audio
          git diff --cached --quiet && echo 'Nothing changed.' && exit 0
          git commit -m 'A chapter read aloud'
          git push
          # Deploy takes it from here, on `workflow_run`: a push made with
          # GITHUB_TOKEN triggers no workflows of its own.
