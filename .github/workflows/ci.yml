name: CI

on:
  push:
  pull_request:
  # A manual trigger, so there is a way to run the checks when a push has not
  # produced a run — which is not hypothetical: an Actions outage left this
  # repository creating no runs at all, with no button to fall back on.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: dist/
