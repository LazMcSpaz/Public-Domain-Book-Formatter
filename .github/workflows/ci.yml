name: CI

on:
  push:
  pull_request:
  # A manual trigger, so there is a way to run the checks when a push has not
  # produced a run — which is not hypothetical: an Actions outage left this
  # repository creating no runs at all, with no button to fall back on.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The one command a session runs before every commit: typecheck, the core
      # purity check, lint, format check, the harness check (`python3
      # harness/check.py`; Python 3 is on the runner) and the tests, stopping at
      # the first failure with that check's own message. Defined once, in
      # package.json, so CI and a session cannot drift apart.
      - run: npm run verify
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: dist/
