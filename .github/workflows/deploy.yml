name: Deploy

# Publishes the static app to GitHub Pages so it can be used from any browser,
# including a phone, with no local server.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # After the sample render, which commits audio with GITHUB_TOKEN — and a push
  # made with that token does not trigger other workflows, so without this the
  # samples sit in the repository and never reach the page.
  workflow_run:
    workflows: [Voice samples, Read a chapter]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency is set on the jobs, not here. Set here, it was taken before the
# `if` below was read, so a render that failed still cancelled the app's own
# deploy and then published nothing: on 19 November 2026 a push that touched
# `scripts/say.mjs` left the app undeployed. A skipped job takes no place in a
# group, so it can no longer cancel anything.
jobs:
  build:
    # A render that failed has nothing new to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # A newer build makes an older one pointless.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Queued, never cancelled: one publish at a time, the newest landing last.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
