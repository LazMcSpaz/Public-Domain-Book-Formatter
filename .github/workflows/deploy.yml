name: Deploy

# Publishes the static app to GitHub Pages so it can be used from any browser,
# including a phone, with no local server.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # After the sample render, which commits audio with GITHUB_TOKEN — and a push
  # made with that token does not trigger other workflows, so without this the
  # samples sit in the repository and never reach the page.
  workflow_run:
    workflows: [Voice samples]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A render that failed has nothing new to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
